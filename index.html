<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上預約系統</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .time-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
        .time-btn { padding: 12px; border: 2px solid #eee; border-radius: 6px; cursor: pointer; font-weight: bold; background: #fff; color: #555; text-align: center; }
        .time-btn.selected { background: #4CAF50; color: white; border-color: #4CAF50; }
        button { background: #007BFF; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="box">
    <h2>📅 線上預約系統</h2>
    <form id="bookingForm">
        <input type="text" id="name" required placeholder="請輸入您的姓名">
        <input type="date" id="date" required>
        <label style="font-weight:bold; display:block; margin: 15px 0 5px; text-align:left; color:#666;">請點選預約時段：</label>
        <div class="time-grid" id="timeGrid"></div>
        <button type="submit">確認預約</button>
    </form>
</div>

<script>
    // 已經幫你自動換上你剛剛提供最正確的正式版 /exec 網址了！
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwPuq7IE4Xd8giaTBE3O0Moj1Bwqs7QrQ383yMcav14RapgFH37CY_Weuk5hSTaA8HZ2A/exec";

    const allSlots = ["09:00 - 10:00", "10:00 - 11:00", "11:00 - 12:00", "12:00 - 13:00", "13:00 - 14:00", "14:00 - 15:00", "15:00 - 16:00", "16:00 - 17:00", "17:00 - 18:00", "18:00 - 19:00", "19:00 - 20:00", "20:00 - 21:00"];
    let selectedTime = "";

    // 預設日期為今天
    document.getElementById('date').valueAsDate = new Date();

    // 100% 強制長出按鈕的函式
    function showButtons() {
        const grid = document.getElementById('timeGrid');
        grid.innerHTML = "";
        selectedTime = "";
        
        allSlots.forEach(slot => {
            const btn = document.createElement('div');
            btn.className = 'time-btn';
            btn.innerText = slot;
            btn.onclick = function() {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedTime = slot;
            };
            grid.appendChild(btn);
        });
    }

    // 處理預約表單送出
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const date = document.getElementById('date').value;

        if (!selectedTime) { alert("❌ 請先點選一個時段！"); return; }

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "book", name: name, date: date, time: selectedTime })
        })
        .then(res => res.json())
        .then(resData => {
            if(resData.status === "success") {
                alert(`🎉 預約成功！\n姓名：${name}\n日期：${date}\n時段：${selectedTime}`);
                document.getElementById('name').value = '';
                showButtons();
            } else {
                alert("預約失敗：" + resData.message);
            }
        })
        .catch(err => {
            // 雲端連線緩衝提示
            alert("預約指令已送出！請至 Google 試算表確認是否有成功寫入資料。");
            document.getElementById('name').value = '';
            showButtons();
        });
    });

    // 網頁一打開立刻執行長按鈕
    showButtons();
</script>

</body>
</html>
