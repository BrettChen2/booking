<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同步雲端預約與取消系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .booking-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
            position: relative;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .time-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 5px;
        }
        .time-btn {
            padding: 12px;
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .time-btn:hover {
            border-color: #4CAF50;
            color: #4CAF50;
            background-color: #f9fff9;
        }
        .time-btn.selected {
            background-color: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
        .cancel-section {
            border-top: 2px dashed #eee;
            padding-top: 20px;
            margin-top: 20px;
        }
        .cancel-btn {
            background-color: #dc3545;
        }
        .cancel-btn:hover {
            background-color: #bd2130;
        }
        .loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            border-radius: 10px;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #333;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <div class="loading-overlay" id="loadingOverlay">連線雲端中，請稍候...</div>
    
    <!-- 預約區塊 -->
    <h2>📅 線上預約系統</h2>
    <form id="bookingForm">
        <div class="form-group">
            <label for="name">預約人姓名</label>
            <input type="text" id="name" required placeholder="請輸入您的姓名">
        </div>
        <div class="form-group">
            <label for="date">預約日期</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>預約時段（請點選一個時段）</label>
            <div class="time-grid" id="timeGrid"></div>
        </div>
        <button type="submit" class="submit-btn">確認預約</button>
    </form>

    <!-- 取消預約區塊 -->
    <div class="cancel-section">
        <h2>❌ 取消預約</h2>
        <form id="cancelForm">
            <div class="form-group">
                <label for="cancelName">原預約人姓名</label>
                <input type="text" id="cancelName" required placeholder="請輸入原預約姓名">
            </div>
            <div class="form-group">
                <label for="cancelDate">原預約日期</label>
                <input type="date" id="cancelDate" required>
            </div>
            <div class="form-group">
                <label for="cancelTime">原預約時段</label>
                <select id="cancelTime" required>
                    <option value="" disabled selected>請選擇要取消的時段</option>
                    <option value="09:00 - 10:00">09:00 - 10:00</option>
                    <option value="10:00 - 11:00">10:00 - 11:00</option>
                    <option value="11:00 - 12:00">11:00 - 12:00</option>
                    <option value="12:00 - 13:00">12:00 - 13:00</option>
                    <option value="13:00 - 14:00">13:00 - 14:00</option>
                    <option value="14:00 - 15:00">14:00 - 15:00</option>
                    <option value="15:00 - 16:00">15:00 - 16:00</option>
                    <option value="16:00 - 17:00">16:00 - 17:00</option>
                    <option value="17:00 - 18:00">17:00 - 18:00</option>
                    <option value="18:00 - 19:00">18:00 - 19:00</option>
                    <option value="19:00 - 20:00">19:00 - 20:00</option>
                    <option value="20:00 - 21:00">20:00 - 21:00</option>
                </select>
            </div>
            <button type="submit" class="submit-btn cancel-btn">確認取消預約</button>
        </form>
    </div>
</div>

<script>
    // ⚠️ 請務必換成你的 GAS 網頁應用程式 URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/library/d/1vRxxRZzR7T1GapeECkLHapd_cvNFK32HlV0saQkeDODkfLp_2f1ccETX/3";

    const allTimeSlots = [
        "09:00 - 10:00", "10:00 - 11:00", "11:00 - 12:00",
        "12:00 - 13:00", "13:00 - 14:00", "14:00 - 15:00",
        "15:00 - 16:00", "16:00 - 17:00", "17:00 - 18:00",
        "18:00 - 19:00", "19:00 - 20:00", "20:00 - 21:00"
    ];

    let bookedData = {};
    let selectedTime = "";
    const dateInput = document.getElementById('date');
    const timeGrid = document.getElementById('timeGrid');
    const loadingOverlay = document.getElementById('loadingOverlay');

    // 修正後的超防呆日期清洗器
    function cleanDateStr(str) {
        if (!str) return "";
        return String(str).split('T')[0].trim();
    }

    // 初始化設定今天日期
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    const todayStr = `${year}-${month}-${day}`;
    
    dateInput.value = todayStr;
    document.getElementById('cancelDate').value = todayStr;

    // 渲染按鈕函式
    function renderTimeSlots() {
        const selectedDate = cleanDateStr(dateInput.value);
        timeGrid.innerHTML = "";
        selectedTime = "";

        const dayBookings = bookedData[selectedDate] || [];
        const unavailableSlots = dayBookings.map(b => b.time);
        const availableSlots = allTimeSlots.filter(slot => !unavailableSlots.includes(slot));

        if (availableSlots.length === 0) {
            timeGrid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #ff4d4f; font-weight: bold; padding: 10px;">本日已無可預約時段 😥</div>`;
            return;
        }

        availableSlots.forEach(slot => {
            const btn = document.createElement('div');
            btn.className = 'time-btn';
            btn.setAttribute('data-time', slot);
            btn.innerText = slot;
            btn.addEventListener('click', function() {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedTime = this.getAttribute('data-time');
            });
            timeGrid.appendChild(btn);
        });
    }

    // 從雲端下載資料
    function fetchCloudData() {
        loadingOverlay.style.display = "flex";
        
        // 預先強制產生空的按鈕，防止因為網路慢或沒回應而一片空白
        renderTimeSlots();

        const cacheBuster = GAS_WEB_APP_URL + (GAS_WEB_APP_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        
        fetch(cacheBuster)
            .then(res => {
                if (!res.ok) throw new Error("網路回應不正確");
                return res.json();
            })
            .then(data => {
                bookedData = {};
                for (let key in data) {
                    bookedData[cleanDateStr(key)] = data[key];
                }
                renderTimeSlots(); // 拿到雲端資料後重新整理遮蔽已被預約的時段
                loadingOverlay.style.display = "none";
            })
            .catch(err => {
                console.error("雲端同步異常，啟動離線暫存模式：", err);
                // 就算失敗了，上面已經強制產生的按鈕依然留著供人操作
                loadingOverlay.style.display = "none";
            });
    }

    dateInput.addEventListener('change', renderTimeSlots);

    // 預約送出
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const date = dateInput.value;

        if (!selectedTime) {
            alert("❌ 請先點選一個預約時段！");
            return;
        }

        loadingOverlay.style.display = "flex";
        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "book", name: name, date: date, time: selectedTime })
        })
        .then(res => res.json())
        .then(resData => {
            if(resData.status === "success") {
                alert(`🎉 預約成功且已同步雲端！\n\n預約人：${name}\n日期：${date}\n時段：${selectedTime}`);
                document.getElementById('name').value = '';
                fetchCloudData();
            } else {
                alert("預約失敗：" + resData.message);
