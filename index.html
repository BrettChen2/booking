<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上預約系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: #f6f8fa; padding: 20px; color: #24292f; }
    .container { max-width: 1100px; margin: 0 auto; display: flex; gap: 20px; flex-wrap: wrap; }
    .card { background: #ffffff; border: 1px solid #d0d7de; border-radius: 6px; padding: 20px; box-shadow: 0 1px 3px rgba(27,31,36,0.04); }
    .left-panel { flex: 1; min-width: 340px; }
    .right-panel { flex: 1.2; min-width: 350px; }
    h2 { font-size: 1.25rem; margin-bottom: 15px; border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
    input, select { width: 100%; padding: 8px 12px; font-size: 0.9rem; border: 1px solid #d0d7de; border-radius: 6px; background-color: #fff; }
    input:focus, select:focus { border-color: #0969da; outline: none; box-shadow: 0 0 0 3px rgba(9,105,218,0.3); }
    
    /* 清單頂部篩選列 */
    .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; background: #f6f8fa; padding: 10px 12px; border-radius: 6px; border: 1px solid #d0d7de; }
    .filter-bar label { margin-bottom: 0; font-size: 0.85rem; color: #57606a; white-space: nowrap; }
    .filter-bar select { width: auto; flex: 1; max-width: 200px; padding: 6px 10px; }

    /* 時段按鈕網格樣式 */
    .time-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 5px; }
    .time-btn { background-color: #ffffff; color: #24292f; border: 1px solid #d0d7de; padding: 8px 4px; font-size: 0.85rem; border-radius: 6px; cursor: pointer; text-align: center; transition: all 0.2s ease; position: relative; }
    .time-btn:hover { background-color: #f3f4f6; border-color: #0969da; }
    .time-btn.selected { background-color: #0969da; color: #ffffff; border-color: #0969da; font-weight: 600; }

    /* 按鈕樣式 */
    .btn-submit { width: 100%; padding: 10px; font-size: 1rem; border: none; border-radius: 6px; background-color: #2da44e; color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background-color: #2c974b; }
    .btn-submit:disabled { background-color: #94d3a2; cursor: not-allowed; }
    .btn-cancel { background-color: #cf222e; }
    .btn-cancel:hover { background-color: #a40e26; }
    
    /* 頁籤樣式 */
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; background: #f3f4f6; color: #24292f; border: 1px solid #d0d7de; padding: 8px; cursor: pointer; font-weight: 500; border-radius: 6px; }
    .tab-btn.active { background: #0969da; color: white; border-color: #0969da; }
    
    /* 右側即時清單樣式 */
    .booking-list { list-style: none; max-height: 520px; overflow-y: auto; }
    .booking-item { background: #ffffff; border: 1px solid #d0d7de; border-left: 5px solid #0969da; padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .booking-time-highlight { font-size: 1.1rem; font-weight: 700; color: #0969da; margin-bottom: 6px; }
    
    /* 預約人與訪問單位水平排列樣式 */
    .booking-info-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 0.9rem; color: #24292f; margin-bottom: 8px; }
    .booking-info-item { display: inline-flex; align-items: center; }

    .time-tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .time-tag { background-color: #ddf4ff; color: #0969da; font-size: 0.8rem; padding: 3px 8px; border-radius: 4px; border: 1px solid #54aeff; font-weight: 500; }
    .time-tag small { color: #57606a; font-size: 0.75rem; margin-left: 3px; }
    .status-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; background: #2da44e; color: white; font-weight: 600; white-space: nowrap; margin-left: 10px; }
    .hint-text { font-size: 0.8rem; color: #57606a; margin-top: 4px; font-weight: normal; }
    .no-slots-msg { grid-column: 1 / -1; text-align: center; color: #cf222e; font-size: 0.85rem; padding: 10px; background: #ffebe9; border-radius: 6px; border: 1px solid #ffc1c0; }
  </style>
</head>
<body>

<div class="container">
  <!-- 左側：預約與取消表單 -->
  <div class="left-panel card">
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchForm('book')">新增預約</button>
      <button class="tab-btn" onclick="switchForm('cancel')">取消預約</button>
    </div>

    <!-- 預約表單 -->
    <form id="booking-form">
      <h2>線上預約申請</h2>
      <div class="form-group">
        <label for="name">姓名 / 稱呼</label>
        <select id="name" required>
          <option value="" disabled selected>-- 請選擇姓名 --</option>
          <option value="吳春滿">吳春滿</option>
          <option value="劉怡妙">劉怡妙</option>
          <option value="許世峰">許世峰</option>
          <option value="楊瑞玲">楊瑞玲</option>
          <option value="陳耿宏">陳耿宏</option>
          <option value="邱慶彰">邱慶彰</option>
          <option value="張鈞睿">張鈞睿</option>
          <option value="李育勇">李育勇</option>
        </select>
      </div>

      <!-- 訪問單位欄位 -->
      <div class="form-group">
        <label for="unit">訪問單位</label>
        <input type="text" id="unit" placeholder="例如：資訊處、研發部..." required>
      </div>

      <div class="form-group">
        <label for="date">預約日期 <span class="hint-text">(僅開放工作天，國定假日不開放)</span></label>
        <input type="date" id="date" required onchange="handleDateChange()">
      </div>
      <div class="form-group">
        <label>選擇可預約時段 (08:00 - 22:00) <div class="hint-text">💡 已隱藏過期與已被預約時段</div></label>
        <div class="time-grid" id="time-grid"></div>
      </div>
      <button type="submit" class="btn-submit" id="btn-book">送出預約</button>
    </form>

    <!-- 取消表單 -->
    <form id="cancel-form" style="display: none;">
      <h2>取消預約</h2>
      <div class="form-group">
        <label for="cancel-id">預約編號</label>
        <input type="text" id="cancel-id" required placeholder="請輸入預約編號">
      </div>
      <div class="form-group">
        <label for="cancel-name">預約姓名驗證</label>
        <select id="cancel-name" required>
          <option value="" disabled selected>-- 請選擇預約時的姓名 --</option>
          <option value="吳春滿">吳春滿</option>
          <option value="劉怡妙">劉怡妙</option>
          <option value="許世峰">許世峰</option>
          <option value="楊瑞玲">楊瑞玲</option>
          <option value="陳耿宏">陳耿宏</option>
          <option value="邱慶彰">邱慶彰</option>
          <option value="張鈞睿">張鈞睿</option>
          <option value="李育勇">李育勇</option>
        </select>
      </div>
      <button type="submit" class="btn-submit btn-cancel" id="btn-cancel">確認取消預約</button>
    </form>
  </div>

  <!-- 右側：即時預約清單 -->
  <div class="right-panel card">
    <h2>預約狀態清單 (僅顯示有效預約)</h2>
    
    <!-- 日期篩選區塊 -->
    <div class="filter-bar">
      <label for="filter-date">🔍 篩選預約日期：</label>
      <select id="filter-date" onchange="renderBookingList()">
        <option value="ALL">顯示全部日期</option>
      </select>
    </div>

    <ul class="booking-list" id="booking-list">
      <li style="text-align:center; color:#57606a;">載入資料中...</li>
    </ul>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxgHeRHyODH2ZFzvCc4LpUwmq8OI7KzUxNDuN1P57Zw382nd1KGRu_f177lKiWHDIZgaA/exec";

  let selectedTimeSlots = [];
  let rawGroupedBookings = [];
  let bookedSlotsSet = new Set();
  
  // 台灣國定假日與補班日快取 (格式：{ '2026-01-01': { isHoliday: true, description: '元旦' } })
  let holidayMap = {};

  function formatDateToString(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function formatDateString(rawDateStr) {
    if (!rawDateStr) return '';
    const str = String(rawDateStr).trim();
    
    const match = str.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (match) {
      const yyyy = match[1];
      const mm = match[2].padStart(2, '0');
      const dd = match[3].padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      return formatDateToString(d);
    }

    return str;
  }

  // 載入台灣行政院人事行政總處行事曆 API
  async function fetchTaiwanHolidays() {
    try {
      const currentYear = new Date().getFullYear();
      // 使用開放社群維護的台灣國定假日 API (支援跨年份)
      const res = await fetch(`https://cdn.jsdelivr.net/gh/wanasit/taiwan-calendar/data/${currentYear}.json`);
      if (res.ok) {
        const data = await res.json();
        data.forEach(item => {
          // 格式化日期為 YYYY-MM-DD
          const formattedDate = `${item.date.substring(0,4)}-${item.date.substring(4,6)}-${item.date.substring(6,8)}`;
          holidayMap[formattedDate] = {
            isHoliday: item.isHoliday,
            description: item.description || (item.isHoliday ? '國定假日' : '補班日')
          };
        });
      }
    } catch (e) {
      console.warn("國定假日 API 載入失敗，退回基本週六日判斷", e);
    }
  }

  // 判斷某一天是否為「工作天/需上班日」
  function isWorkday(dateObj) {
    const dateStr = formatDateToString(dateObj);
    const day = dateObj.getDay(); // 0 是週日, 6 是週六

    // 若 API 資料庫中有紀錄
    if (holidayMap[dateStr]) {
      // isHoliday 為 false 代表是補班日（即便是六日也要上班）
      // isHoliday 為 true 代表是放假（包含國定假日與彈性放假）
      return !holidayMap[dateStr].isHoliday;
    }

    // 若 API 無紀錄（例如非當年資料），退回預設：週一至週五為工作天
    return day !== 0 && day !== 6;
  }

  // 自動找出下一個「可預約的工作天」
  function getNextWorkingDay(dateObj) {
    const d = new Date(dateObj);
    while (!isWorkday(d)) {
      d.setDate(d.getDate() + 1);
    }
    return d;
  }

  async function initDatePicker() {
    await fetchTaiwanHolidays(); // 先載入國定假日資料

    const dateInput = document.getElementById('date');
    const today = new Date();
    
    // 最小可選日期設為今天
    dateInput.min = formatDateToString(today);

    // 預設選擇日期若遇假日/國定假日則自動順延至下一個工作天
    const validDefaultDate = getNextWorkingDay(today);
    dateInput.value = formatDateToString(validDefaultDate);

    generateTimeButtons();
  }

  // 當使用者變更日期時檢查是否為假日/國定假日
  function handleDateChange() {
    const dateInput = document.getElementById('date');
    if (!dateInput.value) return;

    const selectedDate = new Date(dateInput.value + "T00:00:00");
    const dateStr = dateInput.value;

    if (!isWorkday(selectedDate)) {
      let holidayName = "例假日/國定假日";
      if (holidayMap[dateStr] && holidayMap[dateStr].description) {
        holidayName = holidayMap[dateStr].description;
      }
      
      alert(`⚠️ 您選擇的日期 (${dateStr}) 為「${holidayName}」，不開放預約！\n已為您自動調整至下一個工作天。`);
      
      const nextWorkday = getNextWorkingDay(selectedDate);
      dateInput.value = formatDateToString(nextWorkday);
    }

    generateTimeButtons();
  }

  function generateTimeButtons() {
    const grid = document.getElementById('time-grid');
    grid.innerHTML = "";
    selectedTimeSlots = [];
    
    const selectedDateVal = document.getElementById('date').value;
    const now = new Date();
    
    const todayStr = formatDateToString(now);
    const isToday = selectedDateVal === todayStr;
    const currentHour = now.getHours();

    let count = 0;

    for (let hour = 8; hour < 22; hour++) {
      const start = hour.toString().padStart(2, '0') + ":00";
      const end = (hour + 1).toString().padStart(2, '0') + ":00";
      const slot = `${start} - ${end}`;
      const slotKey = `${selectedDateVal}_${slot}`;

      // 1. 若選擇今天且時間已過，則隱藏不顯示
      if (isToday && hour <= currentHour) {
        continue;
      }

      // 2. 若該時段已被預約，則隱藏不顯示
      if (bookedSlotsSet.has(slotKey)) {
        continue;
      }

      count++;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'time-btn';
      btn.innerText = slot;

      btn.onclick = () => {
        if (btn.classList.contains('selected')) {
          btn.classList.remove('selected');
          selectedTimeSlots = selectedTimeSlots.filter(s => s !== slot);
        } else {
          btn.classList.add('selected');
          selectedTimeSlots.push(slot);
        }
      };

      grid.appendChild(btn);
    }

    if (count === 0) {
      grid.innerHTML = `<div class="no-slots-msg">⚠️ 該日期已無可預約的時段</div>`;
    }
  }

  function switchForm(type) {
    const btns = document.querySelectorAll('.tab-btn');
    btns[0].classList.toggle('active', type === 'book');
    btns[1].classList.toggle('active', type === 'cancel');
    document.getElementById('booking-form').style.display = type === 'book' ? 'block' : 'none';
    document.getElementById('cancel-form').style.display = type === 'cancel' ? 'block' : 'none';
  }

  function fetchBookings() {
    const listEl = document.getElementById('booking-list');
    const callbackName = 'handleGasResponse_' + Math.floor(Math.random() * 100000);
    
    window[callbackName] = function(data) {
      delete window[callbackName];
      document.body.removeChild(script);

      if (!Array.isArray(data)) {
        listEl.innerHTML = "<li style='text-align:center;'>資料讀取異常</li>";
        return;
      }

      const activeBookings = data.filter(item => item.status === '已預約');

      bookedSlotsSet.clear();
      activeBookings.forEach(item => {
        const cleanDate = formatDateString(item.date);
        bookedSlotsSet.add(`${cleanDate}_${item.time}`);
      });

      if (activeBookings.length === 0) {
        rawGroupedBookings = [];
        updateDateSelectOptions([]);
        renderBookingList();
        generateTimeButtons();
        return;
      }

      const groupedMap = new Map();

      activeBookings.forEach(item => {
        const cleanDate = formatDateString(item.date);
        const groupKey = `${cleanDate}_${item.name}`;
        const itemUnit = item.unit || item.department || '';

        if (!groupedMap.has(groupKey)) {
          groupedMap.set(groupKey, {
            date: cleanDate,
            name: item.name,
            unit: itemUnit,
            slots: []
          });
        }
        groupedMap.get(groupKey).slots.push({
          time: item.time,
          id: item.id
        });
      });

      const now = new Date();
      const todayStr = formatDateToString(now);

      rawGroupedBookings = Array.from(groupedMap.values()).sort((a, b) => {
        const isAUpcoming = a.date >= todayStr;
        const isBUpcoming = b.date >= todayStr;

        if (isAUpcoming && isBUpcoming) {
          return a.date.localeCompare(b.date);
        } else if (isAUpcoming && !isBUpcoming) {
          return -1;
        } else if (!isAUpcoming && isBUpcoming) {
          return 1;
        } else {
          return b.date.localeCompare(a.date);
        }
      });

      const uniqueDates = Array.from(new Set(rawGroupedBookings.map(item => item.date)));
      updateDateSelectOptions(uniqueDates);
      renderBookingList();
      generateTimeButtons();
    };

    const script = document.createElement('script');
    script.src = `${GAS_API_URL}?callback=${callbackName}`;
    script.onerror = function() {
      listEl.innerHTML = "<li style='text-align:center; color:red; padding: 20px 0;'>資料載入失敗，請檢查網路連線。</li>";
    };
    document.body.appendChild(script);
  }

  function updateDateSelectOptions(dates) {
    const selectEl = document.getElementById('filter-date');
    const currentSelected = selectEl.value;

    selectEl.innerHTML = '<option value="ALL">顯示全部日期</option>';
    
    dates.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.innerText = d;
      selectEl.appendChild(opt);
    });

    if (dates.includes(currentSelected)) {
      selectEl.value = currentSelected;
    } else {
      selectEl.value = 'ALL';
    }
  }

  function renderBookingList() {
    const listEl = document.getElementById('booking-list');
    const selectedFilterDate = document.getElementById('filter-date').value;

    listEl.innerHTML = "";

    const filteredList = rawGroupedBookings.filter(item => {
      if (selectedFilterDate === 'ALL') return true;
      return item.date === selectedFilterDate;
    });

    if (filteredList.length === 0) {
      listEl.innerHTML = "<li style='text-align:center; padding: 20px 0; color:#57606a;'>目前尚無符合條件的預約紀錄</li>";
      return;
    }

    filteredList.forEach(group => {
      group.slots.sort((a, b) => a.time.localeCompare(b.time));

      const slotsHtml = group.slots.map(s => 
        `<span class="time-tag">⏰ ${escapeHtml(s.time)} <small>(${escapeHtml(s.id)})</small></span>`
      ).join('');

      const unitHtml = group.unit 
        ? `<div class="booking-info-item">訪問單位：<strong>${escapeHtml(group.unit)}</strong></div>`
        : '';

      const li = document.createElement('li');
      li.className = 'booking-item';
      li.innerHTML = `
        <div style="flex: 1;">
          <div class="booking-time-highlight">
            📅 ${escapeHtml(group.date)}
          </div>
          <div class="booking-info-row">
            <div class="booking-info-item">
              預約人：<strong>${escapeHtml(group.name)}</strong>
            </div>
            ${unitHtml}
          </div>
          <div class="time-tag-list">
            ${slotsHtml}
          </div>
        </div>
        <span class="status-badge">已預約</span>
      `;
      listEl.appendChild(li);
    });
  }

  document.getElementById('booking-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (selectedTimeSlots.length === 0) return alert("請至少點選一個欲預約的時段！");

    const submitBtn = document.getElementById('btn-book');
    submitBtn.disabled = true;
    submitBtn.innerText = `預約處理中 (共 ${selectedTimeSlots.length} 個時段)...`;

    const nameVal = document.getElementById('name').value;
    const unitVal = document.getElementById('unit').value.trim();
    const dateVal = document.getElementById('date').value;

    let successCount = 0;
    let createdIds = [];
    let failMessages = [];

    for (const slot of selectedTimeSlots) {
      const payload = {
        action: "book",
        name: nameVal,
        unit: unitVal,
        date: dateVal,
        time: slot
      };

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: 'follow'
        });
        const result = await res.json();
        
        if (result.result === "success") {
          successCount++;
          createdIds.push(`${slot} (編號: ${result.id})`);
        } else {
          failMessages.push(`${slot}: ${result.message || "失敗"}`);
        }
      } catch (err) {
        failMessages.push(`${slot}: 連線錯誤`);
      }
    }

    if (successCount > 0) {
      let msg = `成功預約 ${successCount} 個時段！\n\n預約細節：\n` + createdIds.join("\n");
      if (failMessages.length > 0) {
        msg += "\n\n失敗項目：\n" + failMessages.join("\n");
      }
      alert(msg);
      document.getElementById('booking-form').reset();
      initDatePicker();
      fetchBookings();
    } else {
      alert("預約失敗：\n" + failMessages.join("\n"));
    }

    submitBtn.disabled = false;
    submitBtn.innerText = "送出預約";
  });

  document.getElementById('cancel-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('btn-cancel');
    submitBtn.disabled = true;
    submitBtn.innerText = "取消處理中...";

    const payload = {
      action: "cancel",
      id: document.getElementById('cancel-id').value,
      name: document.getElementById('cancel-name').value
    };

    try {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const result = await res.json();
      
      if (result.result === "success") {
        alert("已成功取消預約！");
        document.getElementById('cancel-form').reset();
        fetchBookings();
      } else {
        alert(result.message || "取消失敗，請確認預約編號與姓名是否正確。");
      }
    } catch (err) {
      alert("傳送失敗，請稍後再試。");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "確認取消預約";
    }
  });

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  // 初始化
  initDatePicker();
  fetchBookings();
</script>

</body>
